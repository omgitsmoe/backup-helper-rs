[package]
name = "backup_helper"
version = "0.1.0"
edition = "2024"

[dependencies]
checksum_helper = { path = "../checksum_helper" }
chrono = "0.4.41"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.5.2"
kdl = "6.5.*"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[dev-dependencies]
filetime = "0.2"
pretty_assertions = "1.4"
testdir = "0.9.3"
